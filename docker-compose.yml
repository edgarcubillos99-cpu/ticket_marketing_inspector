services:
  ticket-marketing-inspector:
    build: .
    container_name: ticket_marketing_inspector
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${PORT:-8080}
      UBERSMITH_BASE_URL: ${UBERSMITH_BASE_URL}
      UBERSMITH_USER: ${UBERSMITH_USER}
      UBERSMITH_TOKEN: ${UBERSMITH_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_TABLE: ${MYSQL_TABLE}
      MYSQL_TABLE_SOCIAL: ${MYSQL_TABLE_SOCIAL:-redes_sociales_metricas}
      MYSQL_TABLE_ADS: ${MYSQL_TABLE_ADS:-anuncios_metricas}
      WORKERS: ${WORKERS}
      RUN_ON_START: ${RUN_ON_START}
      CRON_SPEC: ${CRON_SPEC}
      CRON_TZ: ${CRON_TZ}
      BACKFILL: ${BACKFILL:-false}
      BACKFILL_FROM: ${BACKFILL_FROM:-2024-01-01}
      MARKETING_MONTHS_LOOKBACK: ${MARKETING_MONTHS_LOOKBACK:-3}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_API_VERSION: ${META_API_VERSION:-v21.0}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${INSTAGRAM_BUSINESS_ACCOUNT_ID:-}
      META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID:-}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202411}
      LINKEDIN_ORGANIZATION_ID: ${LINKEDIN_ORGANIZATION_ID:-}
      LINKEDIN_AD_ACCOUNT_ID: ${LINKEDIN_AD_ACCOUNT_ID:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_ADS_API_VERSION: ${GOOGLE_ADS_API_VERSION:-v18}
      ADS_RESIDENCIAL_PATTERN: ${ADS_RESIDENCIAL_PATTERN:-}
      ADS_COMERCIAL_PATTERN: ${ADS_COMERCIAL_PATTERN:-}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
