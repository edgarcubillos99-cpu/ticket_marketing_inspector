services:
  ticket-marketing-inspector:
    build: .
    container_name: ticket_marketing_inspector
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${PORT:-8080}
      UBERSMITH_BASE_URL: ${UBERSMITH_BASE_URL}
      UBERSMITH_USER: ${UBERSMITH_USER}
      UBERSMITH_TOKEN: ${UBERSMITH_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_TABLE: ${MYSQL_TABLE}
      WORKERS: ${WORKERS}
      RUN_ON_START: ${RUN_ON_START}
      CRON_SPEC: ${CRON_SPEC}
      CRON_TZ: ${CRON_TZ}
      BACKFILL: ${BACKFILL:-false}
      BACKFILL_FROM: ${BACKFILL_FROM:-2024-01-01}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
